<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>입고 검수</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e7ef; --pri:#1b2a4a; --ok:#1f9d55; --warn:#e8590c; --pink:#e0457e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--pri); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:13px; }
  main { padding:14px 16px 90px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .muted { color:var(--muted); font-size:13px; }
  input, textarea { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .btn { display:block; width:100%; border:0; border-radius:10px; padding:13px; font:inherit; font-weight:700; background:var(--pri); color:#fff; margin-top:10px; }
  .btn.ok { background:var(--ok); } .btn.ghost { background:#fff; color:var(--pri); border:1px solid var(--line); } .btn.pink { background:var(--pink); }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .mb { display:inline-block; font-weight:800; background:#eef3ff; color:var(--pri); border-radius:6px; padding:1px 7px; margin-right:6px; }
  .grp { display:flex; align-items:center; justify-content:space-between; }
  .cnt { background:var(--pink); color:#fff; border-radius:999px; padding:1px 9px; font-size:13px; font-weight:700; }
  .item { cursor:pointer; } .item b { display:block; }
  .warn { background:#fff4e6; border:1px solid #ffd8a8; color:#a3470b; border-radius:10px; padding:8px 10px; font-size:13px; margin-top:8px; }
  .ai { background:#eef8f1; border:1px solid #c3e6cb; color:#14532d; border-radius:10px; padding:8px 10px; font-size:13px; margin-top:8px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .thumbs img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:20; max-width:90%; }
  .hidden { display:none !important; }
  button.mini { border:1px solid #9bd3ae; background:#fff; color:#14532d; border-radius:6px; padding:1px 8px; font-size:12px; margin-left:4px; }
  .qbar { position:sticky; top:52px; z-index:4; background:#fff8db; color:#7a5b00; border-bottom:1px solid #f1df9c; padding:8px 16px; font-size:13px; }
  .qbar.bad { background:#ffe3e3; color:#a61e1e; border-color:#ffc9c9; }
  .qbar button { margin-left:6px; border:0; border-radius:6px; background:#a61e1e; color:#fff; padding:3px 9px; font-size:12px; }
  .chk { display:flex; gap:8px; align-items:flex-start; margin-top:8px; font-size:14px; } .chk input { width:auto; margin-top:4px; }
  h2 { font-size:16px; margin:4px 0 10px; }
  .back { background:none; border:0; color:var(--pri); font:inherit; padding:0 0 10px; }
</style>
</head>
<body>
<header><h1>📷 입고 검수</h1><button id="hdrBtn" class="hidden" onclick="home()">사서함 목록</button></header>
<div id="qbar" class="qbar hidden"></div>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script>
'use strict';
// 물류담당자 전용 — 수강생 로그인 없이 '검수 비밀번호'로 배송 두뇌의 insp* 기능만 쓴다(11-06).
const URL_ = (window.BRAIN || {}).deliveryUrl;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} } };
let PIN = store.get('insp_pin'), AI = true, GROUPS = [], ITEMS = [], CODE = '', CUR = null, PH = [];
// 속도(11-09): 첫 화면에서 검수 대기 전부(ALL)를 한 번에 받아 두고, 사서함을 누르면 폰에서 바로 거른다(서버 왕복 없음)
let ALL = null, MODE = '', FIND = null;
function matchQ(it, q) { q = String(q || '').toUpperCase().replace(/\s+/g, ''); const code = String(it.mb || '').toUpperCase();
  return code === q || (code + '|' + it.name + '|' + it.nick).toUpperCase().replace(/\s+/g, '').indexOf(q) >= 0; }
function groupsOf(list) { const g = {}; list.forEach(it => { const k = it.mb || ('(' + it.name + ')'); g[k] = g[k] || { mb: it.mb, name: it.name, n: 0 }; g[k].n++; });
  return Object.values(g).sort((a, b) => String(a.mb || 'zz').localeCompare(String(b.mb || 'zz'))); }
// 속도(11-09 2차): 지난번 목록을 폰에 기억해 두고 열자마자 보여준 뒤, 뒤에서 새 목록으로 바꾼다
(function () { try { const c = JSON.parse(store.get('insp_all') || 'null'); if (c && Date.now() - c.t < 12 * 3600e3) { ALL = c.items || []; GROUPS = groupsOf(ALL); if (c.ai === false) AI = false; } } catch (_) {} })();
let LOADING = null;
function loadAll() {
  if (LOADING) return LOADING;
  LOADING = call('inspList', { all: 1 }).then(d => {
    if (d.ok) {
      const busy = new Set((typeof Q !== 'undefined' ? Q : []).map(x => x.row));
      ALL = (d.items || []).filter(x => !busy.has(x.row)); AI = d.aiReady !== false; GROUPS = groupsOf(ALL);
      store.set('insp_all', JSON.stringify({ t: Date.now(), items: d.items || [], ai: AI }));
    }
    return d;
  }).finally(() => { LOADING = null; });
  return LOADING;
}
function dropItem(it) { if (ALL && it) { ALL = ALL.filter(x => x.row !== it.row); GROUPS = groupsOf(ALL); store.set('insp_all', JSON.stringify({ t: Date.now(), items: ALL, ai: AI })); } }
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), ms || 2500); }
async function call(action, extra) {
  const res = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: PIN }, extra || {})) });
  const d = await res.json();
  if (d && d.badPin) { store.set('insp_pin', ''); PIN = ''; }
  return d;
}
// 사진 줄이기 — 저장용 1600px, AI용 1280px (JPEG)
function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', q || 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('사진을 읽지 못했어요')); };
    img.src = u;
  });
}

// ── 비밀번호 ──
function pinView(msg) {
  $('hdrBtn').classList.add('hidden');
  $('main').innerHTML = `<div class="card"><h2>검수 비밀번호</h2>
    <p class="muted">강사님께 받은 검수 비밀번호를 넣어주세요. 이 폰에 기억돼요.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="비밀번호">
    ${msg ? `<div class="warn">${esc(msg)}</div>` : ''}
    <button class="btn" onclick="savePin()">시작하기</button></div>`;
}
window.savePin = function () { PIN = $('pin').value.trim(); if (!PIN) return; store.set('insp_pin', PIN); home(); };

// ── 사서함 목록 ──
window.home = async function () {
  if (!PIN) return pinView();
  CODE = ''; CUR = null; MODE = ''; PH = []; aiCancel(); $('hdrBtn').classList.add('hidden');
  $('main').innerHTML = `<div class="card"><label style="margin-top:0">사서함 코드 · 이름으로 찾기</label>
    <div class="row"><input id="q" placeholder="예: B009, 가050, 김효현" autocapitalize="characters" onkeydown="if(event.key==='Enter')openCode(this.value)"><button class="btn" style="flex:0 0 76px;margin:0" onclick="openCode($('q').value)">찾기</button></div>
    <p class="muted" style="margin:8px 0 0">택배 운송장 상품명 앞 [코드]를 넣으세요.</p>
    <button class="btn pink" onclick="findView()">📷 사진부터 찍기 (사서함 자동 찾기)</button>
    <button class="btn ghost" onclick="reportView()">📋 오늘 검수 점검 (빠진 것 찾기)</button></div>
    <div id="grp"><div class="muted">검수 대기 목록 불러오는 중…</div></div>`;
  const draw = (fresh) => {
    const g = $('grp'); if (!g || MODE || CODE) return;          // 다른 화면으로 갔으면 안 그림
    g.innerHTML = `<h2>검수 대기 ${GROUPS.reduce((a, x) => a + x.n, 0)}건 · ${GROUPS.length}명${fresh ? '' : ' <span class="muted">(새로 고치는 중…)</span>'}</h2>` + (GROUPS.length ? GROUPS.map(x =>
      `<div class="card item grp" onclick="openCode('${esc(x.mb || x.name)}')"><span><span class="mb">${esc(x.mb || '번호없음')}</span>${esc(x.name)}</span><span class="cnt">${x.n}</span></div>`).join('')
      : `<div class="card muted">검수 대기 중인 입고가 없어요 🎉</div>`);
  };
  if (ALL) draw(false);                                         // 지난번 목록을 바로 보여주고
  let d; try { d = await loadAll(); } catch (e) { if (!ALL && $('grp')) $('grp').innerHTML = `<div class="warn">연결 오류예요. 잠시 뒤 다시 열어주세요.</div>`; return; }
  if (!d.ok) return pinView(d.error);
  draw(true);                                                   // 새 목록으로 바꾼다
};
// 📋 오늘 검수 점검(11-09) — 유통기한 빈칸·개수 다름·사진 없음·미등록 학생 미처리·오래된 검수대기
window.reportView = async function (day) {
  if (Q.length) toast('아직 저장 중인 검수가 ' + Q.length + '건 있어요 — 끝난 뒤 다시 눌러야 정확해요', 3500);
  MODE = 'report'; CODE = ''; CUR = null; PH = []; aiCancel(); $('hdrBtn').classList.remove('hidden');
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="muted">점검하는 중…</div>`;
  let d; try { d = await call('inspReport', day ? { day } : {}); } catch (e) { if (MODE === 'report') $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="warn">연결 오류예요.</div>`; return; }
  if (MODE !== 'report') return;
  if (!d.ok) { $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="warn">${esc(d.error || '점검 실패')}${/inspReport|unknown|알 수 없/i.test(d.error || '') ? ' — 배송 두뇌 새 버전 배포가 필요해요' : ''}</div>`; return; }
  const li = (x, extra) => `<div class="card" style="padding:8px 10px;margin:6px 0"><span class="mb">${esc(x.who.split(' ')[0])}</span>${esc(x.who.split(' ').slice(1).join(' '))}<br><b>${esc(x.product)}</b> · ${x.qty}개${extra ? ' · ' + extra : ''}${x.memo ? `<br><span class="muted">${esc(x.memo)}</span>` : ''}</div>`;
  const sec = (t, list, f, ok) => `<h2 style="margin-top:14px">${t} <span class="cnt">${list.length}</span></h2>` + (list.length ? list.map(f).join('') : `<div class="muted">${ok || '없음 ✅'}</div>`);
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button>
    <div class="card"><h2 style="margin:0">📋 ${esc(d.day)} 검수 점검</h2><div class="muted">오늘 검수 ${d.doneN}줄 · ${d.doneQty}개 · 아직 검수 대기 ${d.pendN}줄</div>
      <div class="muted" style="margin-top:6px">고칠 게 있으면 강사님께 줄 번호로 알려주세요(시트 재고내역).</div></div>`
    + sec('① 유통기한 빈칸', d.noExp, x => li(x, `재고내역 ${x.row}행`))
    + sec('② 검수 개수 ≠ 등록 수량 (정정 안 함)', d.qtyOff, x => li(x, `등록 ${x.qty}개 · ${x.row}행`))
    + (d.photoCol ? sec('③ 사진 없이 완료', d.noPhoto, x => li(x, `${x.row}행`)) : '')
    + sec('④ 미등록으로 보냈는데 학생이 아직 등록 안 함', d.unreg.filter(u => !u.registered), u => `<div class="card" style="padding:8px 10px;margin:6px 0">${esc(u.at)} · ${esc(u.who)}<br><b>${esc(u.product)}</b>${u.qty ? ' · ' + u.qty + '개' : ''}</div>`)
    + sec('⑤ 등록 3일 넘었는데 검수 안 된 입고', d.stale, x => li(x, `등록 ${esc(x.at)} (${x.age}일)`), '없음 ✅')
    + (d.staleN > d.stale.length ? `<div class="muted">…외 ${d.staleN - d.stale.length}건 (시트 메뉴 '📋 오늘 검수 점검'에서 전체 보기)</div>` : '');
};
window.openCode = async function (q) {
  q = String(q || '').trim(); if (!q) return;
  CODE = q; $('hdrBtn').classList.remove('hidden');
  if (ALL) ITEMS = ALL.filter(it => matchQ(it, q));          // 바로 거르기(서버 안 감)
  else {
    $('main').innerHTML = `<div class="muted">불러오는 중…</div>`;
    let d; try { d = await call('inspList', { q }); } catch (e) { $('main').innerHTML = `<div class="warn">연결 오류예요.</div>`; return; }
    if (!d.ok) return pinView(d.error);
    AI = !!d.aiReady; ITEMS = d.items || [];
  }
  const who = ITEMS[0] ? `<span class="mb">${esc(ITEMS[0].mb || '')}</span>${esc(ITEMS[0].name)}` : esc(q);
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><h2>${who} · 검수 대기 ${ITEMS.length}건</h2>` +
    (ITEMS.length ? ITEMS.map((it, i) => `<div class="card item" onclick="openItem(${i})">
      <b>${esc(it.product)}${it.option ? ' · ' + esc(it.option) : ''}</b>
      <span class="muted">등록 ${it.qty}개 · ${esc(String(it.at).slice(5, 16))}${it.mb && ITEMS.some(x => x.mb !== it.mb) ? ' · ' + esc(it.mb + ' ' + it.name) : ''}</span>
      ${it.memo ? `<div class="muted">📝 ${esc(it.memo)}</div>` : ''}
      ${it.dup ? `<div class="warn">⚠ 같은 상품 입고가 또 있어요: ${esc(it.dup)} — 두 번 등록한 건 아닌지 확인</div>` : ''}</div>`).join('')
      : `<div class="card muted">'${esc(q)}' 검수 대기 입고가 없어요.</div>`) +
    `<button class="btn ghost" onclick="unregView()">📦 등록 안 된 물건 → 수강생에게 사진 보내기</button>`;
};

// ── 상품 검수 ──
function photoBlock() {
  return `<label>사진 (수량·유통기한이 보이게)</label>
    <input id="ph" type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="addPhotos(this.files)">
    <button type="button" class="btn ghost" style="margin-top:0" onclick="$('ph').click()">📷 사진 찍기 / 추가</button>
    <div class="thumbs" id="thumbs"></div><div id="aiBox"></div>`;
}
window.openItem = function (i) {
  const keep = MODE === 'find' && PH.length; CUR = ITEMS[i]; if (!keep) { PH = []; aiCancel(); AIKIND = 'item'; AIREAD_N = 0; LAST_AI = null; } MODE = '';
  NOMB = !!(keep && FIND && FIND.noMb);
  $('main').innerHTML = `<button class="back" onclick="openCode(CODE)">← 목록으로</button>
    <div class="card"><span class="mb">${esc(CUR.mb)}</span>${esc(CUR.name)}<h2 style="margin-top:8px">${esc(CUR.product)}${CUR.option ? ' · ' + esc(CUR.option) : ''}</h2>
      <div class="muted">수강생 등록 수량 <b>${CUR.qty}개</b>${CUR.site ? ' · ' + esc(CUR.site) : ''}</div>
      ${CUR.memo ? `<div class="muted">📝 ${esc(CUR.memo)}</div>` : ''}
      ${CUR.dup ? `<div class="warn">⚠ 같은 상품 입고가 또 있어요: ${esc(CUR.dup)}</div>` : ''}
      ${photoBlock()}
      <label>유통기한</label><input id="exp" placeholder="예: 2027-05-31 (AI가 사진에서 읽어 채워요)" value="${esc(CUR.exp || '')}">
      <label>실제 개수</label><input id="cnt" type="number" inputmode="numeric" value="${CUR.qty}" oninput="qtyCheck()">
      <div id="qtyBox"></div>
      <label>메모 (선택)</label><input id="note" placeholder="파손·포장상태 등">
      <button class="btn ok" id="doneBtn" onclick="done()">✅ 검수 완료</button>
    </div>`;
  if (keep) {                                                // 📷 사진부터 찍은 경우: 사진·AI 값 이어받기
    $('thumbs').innerHTML = PH.map(p => `<img src="${p.big}">`).join('');
    if (FIND) { aiFill(FIND); $('aiBox').innerHTML = aiHtml(FIND); }
    else if (AIRUN) $('aiBox').innerHTML = `<div class="ai">🤖 사진 읽는 중… 끝나면 칸에 채워요</div>`;
    else aiNow();                                            // 아직 안 읽었으면 상품을 누른 지금 한 번에 읽기
  }
};
window.qtyCheck = function () {
  const c = Number($('cnt').value), box = $('qtyBox');
  if (!box) return;
  box.innerHTML = (CUR && $('cnt').value !== '' && c !== CUR.qty)
    ? `<div class="warn">등록 ${CUR.qty}개와 달라요.<label class="chk"><input type="checkbox" id="fix"> 재고 수량을 실제 개수(${c}개)로 고치기</label>
       <span class="muted">체크 안 하면 수량은 그대로 두고 메모에만 남겨요.</span></div>` : '';
};
// 🤖 AI가 읽은 값 — '확실'할 때만 칸에 자동으로 넣고, 애매하면 제안만 보여주고 [넣기]로 사람이 고른다(11-09 정확도)
let LAST_AI = null, NOMB = false;
function aiFill(d) {
  LAST_AI = d;
  const ex = $('exp') || $('uExp'), cn = $('cnt') || $('uQty');
  if (d.expirySure && d.expiry && ex) ex.value = d.expiry;
  if (d.countSure && d.count != null && cn) { cn.value = d.count; if ($('cnt')) qtyCheck(); }
}
function aiHtml(d) {
  const e = d.expiry
    ? (d.expirySure ? `유통기한 <b>${esc(d.expiry)}</b>${d.expiryText ? ` (사진: ${esc(d.expiryText)})` : ''} ✔ 넣었어요`
                    : `유통기한 <b>${esc(d.expiry)}</b>?${d.expiryText ? ` (사진: ${esc(d.expiryText)})` : ''} <span class="muted">확실하지 않아요</span> <button type="button" class="mini" onclick="aiApply('e')">넣기</button>`)
    : `유통기한 <b>못 찾음</b> — 직접 넣어주세요`;
  const c = d.count != null
    ? (d.countSure ? `개수 <b>${d.count}개</b> ✔ 넣었어요`

    expiry: $('uExp').value.trim(), note: $('uNote').value.trim(), photos: PH.map(p => p.big) }); }
  catch (e) { d = { ok: false, error: '연결 오류 — 보내졌는지 시트 「미등록입고」 탭을 확인해 주세요.' }; }
  if (!d.ok) { alert(d.error || '보내지 못했어요'); b.disabled = false; b.textContent = '📤 수강생에게 사진 보내기'; return; }
  toast('📤 ' + (d.name || '') + ' 님에게 사진 ' + d.photos + '장 보냈어요', 3500);
  openCode(CODE || $('uMb').value.trim());
};

if (!URL_) $('main').innerHTML = `<div class="warn">두뇌 주소(config.js)를 못 읽었어요.</div>`; else home();
</script>
</body>
</html>
