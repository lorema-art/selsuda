<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>입고 검수</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e7ef; --pri:#1b2a4a; --ok:#1f9d55; --warn:#e8590c; --pink:#e0457e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--pri); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:13px; }
  main { padding:14px 16px 90px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .muted { color:var(--muted); font-size:13px; }
  input, textarea { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .btn { display:block; width:100%; border:0; border-radius:10px; padding:13px; font:inherit; font-weight:700; background:var(--pri); color:#fff; margin-top:10px; }
  .btn.ok { background:var(--ok); } .btn.ghost { background:#fff; color:var(--pri); border:1px solid var(--line); } .btn.pink { background:var(--pink); }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .mb { display:inline-block; font-weight:800; background:#eef3ff; color:var(--pri); border-radius:6px; padding:1px 7px; margin-right:6px; }
  .grp { display:flex; align-items:center; justify-content:space-between; }
  .cnt { background:var(--pink); color:#fff; border-radius:999px; padding:1px 9px; font-size:13px; font-weight:700; }
  .item { cursor:pointer; } .item b { display:block; }
  .warn { background:#fff4e6; border:1px solid #ffd8a8; color:#a3470b; border-radius:10px; padding:8px 10px; font-size:13px; margin-top:8px; }
  .ai { background:#eef8f1; border:1px solid #c3e6cb; color:#14532d; border-radius:10px; padding:8px 10px; font-size:13px; margin-top:8px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .thumbs img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:20; max-width:90%; }
  .hidden { display:none !important; }
  button.mini { border:1px solid #9bd3ae; background:#fff; color:#14532d; border-radius:6px; padding:1px 8px; font-size:12px; margin-left:4px; }
  .qbar { position:sticky; top:52px; z-index:4; background:#fff8db; color:#7a5b00; border-bottom:1px solid #f1df9c; padding:8px 16px; font-size:13px; }
  .qbar.bad { background:#ffe3e3; color:#a61e1e; border-color:#ffc9c9; }
  .qbar button { margin-left:6px; border:0; border-radius:6px; background:#a61e1e; color:#fff; padding:3px 9px; font-size:12px; }
  .chk { display:flex; gap:8px; align-items:flex-start; margin-top:8px; font-size:14px; } .chk input { width:auto; margin-top:4px; }
  h2 { font-size:16px; margin:4px 0 10px; }
  .back { background:none; border:0; color:var(--pri); font:inherit; padding:0 0 10px; }
  /* 📷 화면 안 카메라(11-18) */
  .cam { position:fixed; inset:0; background:#000; z-index:30; display:flex; flex-direction:column; }
  .cam video { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  .camThumbs { display:flex; gap:6px; padding:6px 10px; overflow-x:auto; min-height:58px; background:#111; }
  .camThumbs img { width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid #444; }
  .camBar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:#111; gap:10px; }
  .camBar button { border:0; border-radius:10px; padding:12px 14px; font:inherit; font-size:15px; background:#333; color:#fff; min-width:84px; }
  .camBar button.ok { background:#2f9e44; }
  .camBar .shutter { width:74px; height:74px; min-width:74px; border-radius:50%; background:#fff; border:5px solid #888; padding:0; }
  .camBar .shutter:active { background:#ddd; }
  .camFlash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:31; transition:opacity .15s; }
  .camAlt { color:#bbb; background:none; border:0; font-size:13px; padding:6px; text-decoration:underline; }
</style>
</head>
<body>
<header><h1>📷 입고 검수</h1><button id="hdrBtn" class="hidden" onclick="home()">사서함 목록</button></header>
<div id="qbar" class="qbar hidden"></div>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>
<div id="cam" class="cam hidden">
  <video id="camV" playsinline autoplay muted></video>
  <div class="camThumbs" id="camThumbs"></div>
  <div class="camBar">
    <button type="button" onclick="camClose()">닫기</button>
    <button type="button" class="shutter" id="camShot" onclick="camShot()" aria-label="찍기"></button>
    <button type="button" class="ok" onclick="camClose()">완료 <span id="camN">0</span>장</button>
  </div>
  <div style="text-align:center;background:#111;padding-bottom:8px"><button type="button" class="camAlt" onclick="camClose(); camFallback()">휴대폰 기본 카메라로 찍기</button></div>
</div>
<div id="camFlash" class="camFlash"></div>
<script src="config.js"></script>
<script>
'use strict';
// 물류담당자 전용 — 수강생 로그인 없이 '검수 비밀번호'로 배송 두뇌의 insp* 기능만 쓴다(11-06).
const URL_ = (window.BRAIN || {}).deliveryUrl;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} } };
let PIN = store.get('insp_pin'), AI = true, GROUPS = [], ITEMS = [], CODE = '', CUR = null, PH = [];
// 속도(11-09): 첫 화면에서 검수 대기 전부(ALL)를 한 번에 받아 두고, 사서함을 누르면 폰에서 바로 거른다(서버 왕복 없음)
let ALL = null, MODE = '', FIND = null;
function matchQ(it, q) { q = String(q || '').toUpperCase().replace(/\s+/g, ''); const code = String(it.mb || '').toUpperCase();
  return code === q || (code + '|' + it.name + '|' + it.nick).toUpperCase().replace(/\s+/g, '').indexOf(q) >= 0; }
// ── 수강생 입고 목록 정렬·AI 추천·검색 (11-16 루크) ──
//  ① 기본은 최신 입고신청이 위로 ② AI가 사진에서 읽은 상품명과 비슷한 입고를 맨 위로(🤖 추천) ③ 목록 안 검색
function tsOf(it) {
  const m = String(it.at || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:\D+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
  if (!m) return 0;
  let h = Number(m[4] || 0); if (/오후|PM/i.test(it.at) && h < 12) h += 12; if (/오전|AM/i.test(it.at) && h === 12) h = 0;
  return new Date(+m[1], +m[2] - 1, +m[3], h, +(m[5] || 0), +(m[6] || 0)).getTime();
}
function normP(s) { return String(s || '').toLowerCase().replace(/\d+\s*(ml|g|kg|l|매|개입?|정|캡슐|포|병|팩|입)\b/g, ' ').replace(/[^0-9a-z가-힣]+/g, ' ').trim(); }
function bigrams(s) { s = s.replace(/\s+/g, ''); const o = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); o.set(k, (o.get(k) || 0) + 1); } return o; }
function simP(a, b) {                                    // 0~1: 글자 두 개씩 겹침(다이스) + 단어 겹침
  a = normP(a); b = normP(b); if (!a || !b) return 0;
  const A = bigrams(a), B = bigrams(b); let inter = 0, na = 0, nb = 0;
  A.forEach((v, k) => { na += v; if (B.has(k)) inter += Math.min(v, B.get(k)); }); B.forEach(v => { nb += v; });
  const dice = na + nb ? 2 * inter / (na + nb) : 0;
  const ta = a.split(' ').filter(w => w.length >= 2), tb = new Set(b.split(' ').filter(w => w.length >= 2));
  const tok = ta.length ? ta.filter(w => tb.has(w) || [...tb].some(x => x.length >= 3 && (x.includes(w) || w.includes(x)))).length / ta.length : 0;
  return Math.max(dice, 0.6 * dice + 0.4 * tok);
}
function prepItems(list, aiProd) {                       // ITEMS 자체를 정렬(openItem 이 번호로 집으므로)
  list.forEach(it => { it._ts = tsOf(it); it._sim = aiProd ? simP(aiProd, it.product + ' ' + (it.option || '')) : 0; it._rec = false; });
  list.sort((x, y) => (y._ts - x._ts) || ((y.row || 0) - (x.row || 0)));
  if (aiProd) {
    const rec = list.filter(it => it._sim >= 0.3).sort((x, y) => y._sim - x._sim).slice(0, 3);
    rec.forEach(it => { it._rec = true; });
    return rec.concat(list.filter(it => !it._rec));
  }
  return list;
}
function listHtml(list, opt) {
  opt = opt || {};
  const search = list.length >= 4 ? `<div class="row" style="margin:6px 0"><input id="iq" placeholder="🔍 상품명으로 찾기 (예: 샴푸, 다리미)" oninput="filterItems(this.value)" autocomplete="off"></div>` : '';
  const recN = list.filter(it => it._rec).length;
  return search + (recN ? `<div class="muted" style="margin:4px 0">🤖 사진 속 상품과 비슷한 입고를 맨 위에 올렸어요 · 나머지는 최신 신청순</div>` : (list.length > 1 ? `<div class="muted" style="margin:4px 0">최신 입고신청이 위에 있어요</div>` : '')) +
    list.map((it, i) => `<div class="card item" data-hay="${esc(normP(it.product + ' ' + (it.option || '') + ' ' + (it.memo || '')))}" onclick="openItem(${i})"${it._rec ? ' style="border:2px solid #7c4dff"' : ''}>
      ${it._rec ? `<div style="font-size:12px;color:#7c4dff;font-weight:700">🤖 AI 추천 — 사진 속 상품과 비슷해요</div>` : ''}
      <b>${esc(it.product)}${it.option ? ' · ' + esc(it.option) : ''}</b>
      <span class="muted">등록 ${it.qty}개 · ${esc(String(it.at).slice(5, 16))}${opt.who && it.mb && list.some(x => x.mb !== it.mb) ? ' · ' + esc(it.mb + ' ' + it.name) : ''}</span>
      ${opt.memo && it.memo ? `<div class="muted">📝 ${esc(it.memo)}</div>` : ''}
      ${it.ret ? `<div class="warn" style="background:#e3f2fd;color:#0d47a1">↩ 반품 회수 입고${opt.memo ? ' — 고객에게서 돌아온 물건이에요. 상태(개봉·파손·구성품)를 확인해 주세요' : ''}</div>` : ''}
      ${it.dup ? `<div class="warn">⚠ 같은 상품 입고가 또 있어요: ${esc(it.dup)}${opt.memo ? ' — 두 번 등록한 건 아닌지 확인' : ''}</div>` : ''}</div>`).join('') +
    (list.length >= 4 ? `<div id="iqNone" class="card muted hidden">찾는 상품이 없어요. 수강생이 등록을 안 했다면 아래 버튼으로 사진을 보내주세요.</div>` : '');
}
window.filterItems = function (q) {
  const w = normP(q).split(' ').filter(Boolean); let n = 0;
  document.querySelectorAll('.card.item[data-hay]').forEach(el => {
    const hay = el.dataset.hay.replace(/\s+/g, ''), ok = !w.length || w.every(x => hay.includes(x.replace(/\s+/g, '')));
    el.style.display = ok ? '' : 'none'; if (ok) n++;
  });
  const none = $('iqNone'); if (none) none.classList.toggle('hidden', n > 0);
};
function groupsOf(list) { const g = {}; list.forEach(it => { const k = it.mb || ('(' + it.name + ')'); g[k] = g[k] || { mb: it.mb, name: it.name, n: 0 }; g[k].n++; });
  return Object.values(g).sort((a, b) => String(a.mb || 'zz').localeCompare(String(b.mb || 'zz'))); }
// 속도(11-09 2차): 지난번 목록을 폰에 기억해 두고 열자마자 보여준 뒤, 뒤에서 새 목록으로 바꾼다
(function () { try { const c = JSON.parse(store.get('insp_all') || 'null'); if (c && Date.now() - c.t < 12 * 3600e3) { ALL = c.items || []; GROUPS = groupsOf(ALL); if (c.ai === false) AI = false; } } catch (_) {} })();
let LOADING = null;
function loadAll() {
  if (LOADING) return LOADING;
  LOADING = call('inspList', { all: 1 }).then(d => {
    if (d.ok) {
      const busy = new Set((typeof Q !== 'undefined' ? Q : []).map(x => x.row));
      ALL = (d.items || []).filter(x => !busy.has(x.row)); AI = d.aiReady !== false; GROUPS = groupsOf(ALL);
      store.set('insp_all', JSON.stringify({ t: Date.now(), items: d.items || [], ai: AI }));
    }
    return d;
  }).finally(() => { LOADING = null; });
  return LOADING;
}
// 일부 검수: 목록에서 빼지 않고 남은 개수만 줄여 둔다(서버도 원래 줄 수량을 남은 개수로 줄임)
function keepPartial(it, n) {
  it.qty = Math.max(0, it.qty - n); it.memo = (it.memo ? it.memo + ' / ' : '') + `일부 검수 ${n}개 — 남은 ${it.qty}개 대기`;
  if (ALL) { const x = ALL.find(y => y.row === it.row); if (x && x !== it) { x.qty = it.qty; x.memo = it.memo; } GROUPS = groupsOf(ALL); store.set('insp_all', JSON.stringify({ t: Date.now(), items: ALL, ai: AI })); }
}
function dropItem(it) { if (ALL && it) { ALL = ALL.filter(x => x.row !== it.row); GROUPS = groupsOf(ALL); store.set('insp_all', JSON.stringify({ t: Date.now(), items: ALL, ai: AI })); } }
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), ms || 2500); }
async function call(action, extra) {
  const t0 = Date.now();
  const res = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pin: PIN }, extra || {})) });
  const d = await res.json();
  if (d && d.badPin) { store.set('insp_pin', ''); PIN = ''; }
  // ⏱ 11-18: AI 읽기를 폰에서 기다린 시간(사진 올리기 포함)을 두뇌 'AI사용기록'에 따로 적는다 — 기다리지 않고 뒤에서
  if (action === 'inspRead' && d && d.logId) {
    const ms = Date.now() - t0;
    fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'inspTiming', pin: PIN, id: d.logId, ms }) }).catch(() => {});
  }
  return d;
}
// 사진 줄이기 — 저장용 1600px, AI용 1280px (JPEG)
function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', q || 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('사진을 읽지 못했어요')); };
    img.src = u;
  });
}

// 이미 줄인 사진(dataURL)을 한 번 더 작게 — 사서함 찾기용(11-19)
function shrinkUrl(u, max, q) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q || 0.8));
    };
    img.onerror = () => no(new Error('사진 줄이기 실패'));
    img.src = u;
  });
}

// ── 비밀번호 ──
function pinView(msg) {
  $('hdrBtn').classList.add('hidden');
  $('main').innerHTML = `<div class="card"><h2>검수 비밀번호</h2>
    <p class="muted">강사님께 받은 검수 비밀번호를 넣어주세요. 이 폰에 기억돼요.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="비밀번호">
    ${msg ? `<div class="warn">${esc(msg)}</div>` : ''}
    <button class="btn" onclick="savePin()">시작하기</button></div>`;
}
window.savePin = function () { PIN = $('pin').value.trim(); if (!PIN) return; store.set('insp_pin', PIN); home(); };

// ── 사서함 목록 ──
window.home = async function () {
  if (!PIN) return pinView();
  CODE = ''; CUR = null; MODE = ''; PH = []; aiCancel(); $('hdrBtn').classList.add('hidden'); draftSave();
  $('main').innerHTML = `<div class="card"><label style="margin-top:0">사서함 코드 · 이름으로 찾기</label>
    <div class="row"><input id="q" placeholder="예: B009, 가050, 김효현" autocapitalize="characters" onkeydown="if(event.key==='Enter')openCode(this.value)"><button class="btn" style="flex:0 0 76px;margin:0" onclick="openCode($('q').value)">찾기</button></div>
    <p class="muted" style="margin:8px 0 0">택배 운송장 상품명 앞 [코드]를 넣으세요.</p>
    <button class="btn pink" onclick="findView()">📷 사진부터 찍기 (사서함 자동 찾기)</button>
    <button class="btn ghost" onclick="reportView()">📋 오늘 검수 점검 (빠진 것 찾기)</button>
    <button class="btn ghost" onclick="returnsView()">↩ 돌아오는 고객반품 (도착 확인)</button></div>
    <div id="grp"><div class="muted">검수 대기 목록 불러오는 중…</div></div>`;
  const draw = (fresh) => {
    const g = $('grp'); if (!g || MODE || CODE) return;          // 다른 화면으로 갔으면 안 그림
    g.innerHTML = `<h2>검수 대기 ${GROUPS.reduce((a, x) => a + x.n, 0)}건 · ${GROUPS.length}명${fresh ? '' : ' <span class="muted">(새로 고치는 중…)</span>'}</h2>` + (GROUPS.length ? GROUPS.map(x =>
      `<div class="card item grp" onclick="openCode('${esc(x.mb || x.name)}')"><span><span class="mb">${esc(x.mb || '번호없음')}</span>${esc(x.name)}</span><span class="cnt">${x.n}</span></div>`).join('')
      : `<div class="card muted">검수 대기 중인 입고가 없어요 🎉</div>`);
  };
  if (ALL) draw(false);                                         // 지난번 목록을 바로 보여주고
  let d; try { d = await loadAll(); } catch (e) { if (!ALL && $('grp')) $('grp').innerHTML = `<div class="warn">연결 오류예요. 잠시 뒤 다시 열어주세요.</div>`; return; }
  if (!d.ok) return pinView(d.error);
  draw(true);                                                   // 새 목록으로 바꾼다
};
// 📋 오늘 검수 점검(11-09) — 유통기한 빈칸·개수 다름·사진 없음·미등록 학생 미처리·오래된 검수대기
window.reportView = async function (day) {
  if (Q.length) toast('아직 저장 중인 검수가 ' + Q.length + '건 있어요 — 끝난 뒤 다시 눌러야 정확해요', 3500);
  MODE = 'report'; CODE = ''; CUR = null; PH = []; aiCancel(); $('hdrBtn').classList.remove('hidden');
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="muted">점검하는 중…</div>`;
  let d; try { d = await call('inspReport', day ? { day } : {}); } catch (e) { if (MODE === 'report') $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="warn">연결 오류예요.</div>`; return; }
  if (MODE !== 'report') return;
  if (!d.ok) { $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button><div class="warn">${esc(d.error || '점검 실패')}${/inspReport|unknown|알 수 없/i.test(d.error || '') ? ' — 배송 두뇌 새 버전 배포가 필요해요' : ''}</div>`; return; }
  const li = (x, extra) => `<div class="card" style="padding:8px 10px;margin:6px 0"><span class="mb">${esc(x.who.split(' ')[0])}</span>${esc(x.who.split(' ').slice(1).join(' '))}<br><b>${esc(x.product)}</b> · ${x.qty}개${extra ? ' · ' + extra : ''}${x.memo ? `<br><span class="muted">${esc(x.memo)}</span>` : ''}</div>`;
  const sec = (t, list, f, ok) => `<h2 style="margin-top:14px">${t} <span class="cnt">${list.length}</span></h2>` + (list.length ? list.map(f).join('') : `<div class="muted">${ok || '없음 ✅'}</div>`);
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button>

      <div class="muted" style="margin-top:6px">고칠 게 있으면 강사님께 줄 번호로 알려주세요(시트 재고내역).</div></div>`
    + sec('① 유통기한 빈칸', d.noExp, x => li(x, `재고내역 ${x.row}행`))
    + sec('② 검수 개수 ≠ 등록 수량 (정정 안 함)', d.qtyOff, x => li(x, `등록 ${x.qty}개 · ${x.row}행`))
    + (d.photoCol ? sec('③ 사진 없이 완료', d.noPhoto, x => li(x, `${x.row}행`)) : '')

    + sec('⑤ 등록 3일 넘었는데 검수 안 된 입고', d.stale, x => li(x, `등록 ${esc(x.at)} (${x.age}일)`), '없음 ✅')
    + (d.staleN > d.stale.length ? `<div class="muted">…외 ${d.staleN - d.stale.length}건 (시트 메뉴 '📋 오늘 검수 점검'에서 전체 보기)</div>` : '');

// ↩ 돌아오는 고객반품(11-24) — 반품 박스가 도착하면 [도착 확인] → 회수완료 처리(반품비 차감·재고 복구) → 검수 대기로
let RETS = [];
window.returnsView = async function (q) {
  MODE = 'returns'; CODE = ''; CUR = null; PH = []; aiCancel(); $('hdrBtn').classList.remove('hidden');
  const back = `<button class="back" onclick="home()">← 사서함 목록</button>`;
  $('main').innerHTML = back + `<div class="muted">반품 목록 불러오는 중…</div>`;
  let d; try { d = await call('inspReturns'); } catch (e) { if (MODE === 'returns') $('main').innerHTML = back + `<div class="warn">연결 오류예요.</div>`; return; }
  if (MODE !== 'returns') return;
  if (!d.ok) { $('main').innerHTML = back + `<div class="warn">${esc(d.error || '불러오기 실패')}${/inspReturns|unknown|알 수 없/i.test(d.error || '') ? ' — 배송 두뇌 새 버전 배포가 필요해요' : ''}</div>`; return; }
  RETS = d.items || [];
  $('main').innerHTML = back + `<div class="card"><h2 style="margin:0">↩ 돌아오는 고객반품 ${RETS.length}건</h2>
      <div class="muted" style="margin-top:6px">반품 박스가 사무실에 도착하면 <b>[도착 확인]</b>을 누르세요. 반품배송비 차감·재고 복구가 되고, 그 물건은 바로 <b>검수 대기</b>에 떠요(상태 확인 후 검수 완료).</div>
      <div class="row" style="margin-top:8px"><input id="rq" placeholder="반품송장 뒷자리 · 사서함 · 이름 · 상품" oninput="returnsFilter(this.value)"></div></div>
    <div id="retList"></div>`;

};
window.returnsFilter = function (q) {
  const el = $('retList'); if (!el) return;
  const n = String(q || '').toUpperCase().replace(/[\s-]+/g, '');
  const list = RETS.map((x, i) => ({ x, i })).filter(({ x }) => !n || (String(x.inv) + '|' + x.mb + '|' + x.name + '|' + x.product + '|' + x.option).toUpperCase().replace(/[\s-]+/g, '').indexOf(n) >= 0);
  el.innerHTML = list.length ? list.map(({ x, i }) => `<div class="card" style="padding:10px;margin:6px 0">
      <span class="mb">${esc(x.mb || '번호없음')}</span>${esc(x.name)} <span class="muted">· 접수 ${esc(String(x.at).slice(5, 16))}</span><br>
      <b>${esc(x.product)}</b>${x.option ? ' · ' + esc(x.option) : ''} · ${x.qty}개<br>
      <span class="muted">${x.inv ? '반품송장 ' + esc(x.inv) + (x.courier ? ' (' + esc(x.courier) + ')' : '') : '반품송장 아직 없음'}${x.reason ? ' · ' + esc(x.reason) : ''}</span>
      <button class="btn pink" style="margin:8px 0 0" id="ra${i}" onclick="returnArrive(${i})">📦 도착 확인</button></div>`).join('')
    : `<div class="card muted">${n ? '찾는 반품이 없어요.' : '도착을 기다리는 고객반품이 없어요 🎉'}</div>`;
};
window.returnArrive = async function (i) {
  const x = RETS[i]; if (!x) return;
  if (!confirm(`${x.mb ? x.mb + ' ' : ''}${x.name} 님 반품이 도착했나요?

${x.product}${x.option ? ' · ' + x.option : ''} × ${x.qty}개

[확인]을 누르면 회수완료로 처리돼요
(반품배송비 차감 · 재고 복구 → 검수 대기)`)) return;
  const b = $('ra' + i); if (b) { b.disabled = true; b.textContent = '처리 중…'; }
  let d; try { d = await call('inspReturnArrived', { row: x.row, id: x.id }); } catch (e) { d = { ok: false, error: '연결 오류예요. 목록을 새로 고친 뒤 확인해주세요.' }; }
  if (!d.ok) { alert(d.error || '처리하지 못했어요.'); if (b) { b.disabled = false; b.textContent = '📦 도착 확인'; } return; }
  toast('↩ 도착 확인 — ' + (d.result || '처리됨').replace(/^✅\s*/, '').slice(0, 60), 4000);
  RETS.splice(i, 1); returnsFilter(($('rq') || {}).value || '');
  ALL = null; try { await loadAll(); } catch (_) {}            // 복구된 물건이 검수 대기에 바로 뜨게
  const code = d.mb || x.mb;
  if (code && MODE === 'returns' && confirm('이 반품 물건을 지금 검수할까요?')) { MODE = ''; openCode(code); }
};
window.openCode = async function (q) {
  q = String(q || '').trim(); if (!q) return;
  CODE = q; $('hdrBtn').classList.remove('hidden');
  if (ALL) ITEMS = ALL.filter(it => matchQ(it, q));          // 바로 거르기(서버 안 감)
  else {
    $('main').innerHTML = `<div class="muted">불러오는 중…</div>`;
    let d; try { d = await call('inspList', { q }); } catch (e) { $('main').innerHTML = `<div class="warn">연결 오류예요.</div>`; return; }
    if (!d.ok) return pinView(d.error);
    AI = !!d.aiReady; ITEMS = d.items || [];
  }
  ITEMS = prepItems(ITEMS, '');
  const who = ITEMS[0] ? `<span class="mb">${esc(ITEMS[0].mb || '')}</span>${esc(ITEMS[0].name)}` : esc(q);
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button>
    <button class="btn pink" style="margin:0 0 10px" onclick="nextBox()">📷 다음 박스 찍기 (사서함 자동 찾기)</button><h2>${who} · 검수 대기 ${ITEMS.length}건</h2>` +
    (ITEMS.length > 1 ? `<button class="btn pink" style="margin:4px 0" onclick="findView('${esc(ITEMS[0].mb || q)}')">📷 상품 사진 찍으면 AI가 비슷한 입고를 맨 위로</button>` : '') +
    (ITEMS.length ? listHtml(ITEMS, { who: 1, memo: 1 })
      : `<div class="card muted">'${esc(q)}' 검수 대기 입고가 없어요.</div>`) +
    `<button class="btn ghost" onclick="unregView()">📦 등록 안 된 물건 → 수강생에게 사진 보내기</button>`;
};

// ── 상품 검수 ──

    <input id="ph" type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="addPhotos(this.files)">

    <div class="thumbs" id="thumbs"></div><div id="aiBox"></div>`;
}

      ${CUR.dup ? `<div class="warn">⚠ 같은 상품 입고가 또 있어요: ${esc(CUR.dup)}</div>` : ''}

      ${photoBlock()}

    </div>
    <div class="card"><b>⚠ 문제가 있어요 — 수강생에게 반품 권장 안내 보내기</b>
      <p class="muted" style="margin:6px 0">위에서 찍은 사진이 함께 가요. 이 입고는 검수 처리하지 않고 목록에 남아요(시트에 빨갛게 표시).</p>
      <button type="button" class="btn ghost" onclick="issueSend('bundle')">📦 합포장(1+1 등) — 낱개 발송 어려움</button>

    if (FIND && FIND.lite) { AIKIND = 'item'; AIREAD_N = 0; LAST_AI = null; aiNow(); }

// ⚠ 합포장·다른 제품 → 수강생에게 사진+반품 권장 안내(11-11 루크). 바로 보내고 결과를 기다린다(검수 완료와 달리 뒤에서 저장 안 함).
let ISSUE_BUSY = false;
window.issueSend = async function (kind) {
  const it = CUR; if (!it || ISSUE_BUSY) return;
  if (!PH.length) { toast('사진을 먼저 찍어주세요 — 수강생에게 같이 보내져요', 3000); return; }
  const B = (($('issueB') || {}).value || '').trim();
  if (kind === 'wrong' && !B) { toast('실제 도착한 제품 이름을 적어주세요', 3000); $('issueB').focus(); return; }
  const what = kind === 'bundle'
    ? `📦 합포장 상품이라 발송이 어렵다`
    : `🔀 등록 상품: ${it.product}\n   실제 도착: ${B}`;
  if (!confirm(`${it.name || it.mb} 님에게 아래 안내를 사진 ${PH.length}장과 함께 보낼까요?\n\n${what}\n→ 공급처 반품을 권장드려요`)) return;
  ISSUE_BUSY = true; toast('보내는 중…', 8000);
  let d;
  try { d = await call('inspIssue', { row: it.row, at: it.at, product: it.product, kind, actual: B, note: ($('note') || {}).value || '', photos: PH.map(p => p.big) }); }
  catch (e) { d = { ok: false, error: '연결 오류' }; }
  finally { ISSUE_BUSY = false; }
  if (d && d.badPin) return pinView(d.error);
  if (!d || !d.ok) { toast('⚠ 못 보냈어요: ' + ((d && d.error) || '오류'), 4000); return; }
  it.memo = (it.memo ? it.memo + ' / ' : '') + '⚠ 반품 권장 안내 보냄'; it.issued = true;
  PH = []; draftSave(); toast(`✅ ${d.name || ''} 님에게 안내 보냈어요 (사진 ${d.photos}장)`, 3500);
  openCode(CODE);
};
window.qtyCheck = function () {
  const c = Number($('cnt').value), box = $('qtyBox');
  if (!box) return;
  if (!(CUR && $('cnt').value !== '' && c !== CUR.qty)) { box.innerHTML = ''; return; }
  // 📦 11-10 루크: 10개가 2개씩 박스로 나눠 오면 → '일부만 도착'으로 이번 개수만 검수, 나머지는 목록에 남김(기본 선택)
  const part = c > 0 && c < CUR.qty;
  box.innerHTML = `<div class="warn">등록 ${CUR.qty}개와 달라요.
    ${part ? `<label class="chk"><input type="radio" name="qm" value="part" checked> 📦 <b>일부만 도착</b> — 이번 ${c}개만 검수, 남은 ${CUR.qty - c}개는 목록에 남기기</label>` : ''}
    <label class="chk"><input type="radio" name="qm" value="fix"> 재고 수량을 실제 개수(${c}개)로 고치기</label>
    <label class="chk"><input type="radio" name="qm" value="memo"${part ? '' : ' checked'}> 수량은 그대로 두고 메모에만 남기기</label></div>`;
};
// 🤖 AI가 읽은 값 — '확실'할 때만 칸에 자동으로 넣고, 애매하면 제안만 보여주고 [넣기]로 사람이 고른다(11-09 정확도)
let LAST_AI = null, NOMB = false;
// 📮 '사서함 번호 없음' 안내는 자동으로 보내지 않는다(11-12 루크: 주소에 번호를 적었는데도 안내가 감 = AI가 못 읽은 것).
//  AI가 번호를 못 찾았을 때만, 검수 완료 직전에 담당자에게 송장을 직접 보고 확인받는다.
function noMbOk() {
  if (!NOMB) return false;
  return confirm('📮 AI가 송장에서 사서함 번호를 못 찾았어요.\n\n송장(받는 주소)을 직접 보고 확인해 주세요.\n정말 사서함 번호가 없나요?\n\n[확인] = 번호 없음 → 수강생에게 "사서함 번호를 꼭 적어주세요" 안내 보내기\n[취소] = 번호 있음(AI가 못 읽음) → 안내 안 보냄');
}
function aiFill(d) {
  LAST_AI = d;
  const ex = $('exp') || $('uExp'), cn = $('cnt') || $('uQty');
  if (d.expirySure && d.expiry && ex) ex.value = d.expiry;
  if (d.countSure && d.count != null && cn) { cn.value = d.count; if ($('cnt')) qtyCheck(); }
}
function aiHtml(d) {
  const e = d.expiry
    ? (d.expirySure ? `유통기한 <b>${esc(d.expiry)}</b>${d.expiryText ? ` (사진: ${esc(d.expiryText)})` : ''} ✔ 넣었어요`
                    : `유통기한 <b>${esc(d.expiry)}</b>?${d.expiryText ? ` (사진: ${esc(d.expiryText)})` : ''} <span class="muted">확실하지 않아요</span> <button type="button" class="mini" onclick="aiApply('e')">넣기</button>`)
    : `유통기한 <b>못 찾음</b> — 직접 넣어주세요`;
  const c = d.count != null
    ? (d.countSure ? `개수 <b>${d.count}개</b> ✔ 넣었어요`

  MODE = 'find'; PH = []; FIND = null; CUR = null; aiCancel(); AIKIND = 'find'; AIREAD_N = 0; $('hdrBtn').classList.remove('hidden');
  if (!noCam) setTimeout(() => { if (MODE === 'find' && !PH.length) camOpen(true); }, 0);   // 화면 열리면 카메라 바로(탭 한 번 줄임)
  FIND_PRE = String(pre || '');
  $('main').innerHTML = `<button class="back" onclick="home()">← 사서함 목록</button>
    <div class="card"><h2>📷 사진부터 찍기</h2>
      <p class="muted">${FIND_PRE ? '상품이 잘 보이게 찍어주세요. AI가 <b>상품명</b>을 읽어 비슷한 입고를 맨 위로 올리고, 유통기한·개수도 읽어요.' : '송장(주소 라벨)과 상품이 함께 보이게 찍어주세요. AI가 <b>사서함 번호</b>·유통기한·개수를 읽어요.'}</p>
      ${photoBlock()}</div><div id="findBox"></div>`;
  CODE = FIND_PRE;
  findPick(FIND_PRE);
  // 지난번 목록으로 바로 보여주고, 새 목록이 오면 지금 보던 사서함 그대로 다시 그린다
  loadAll().then(d => { if (d && d.ok && MODE === 'find' && $('findBox') && !($('fq') && $('fq').value)) findPick(CODE || (FIND && FIND.mb) || ''); }).catch(() => {});
};
async function findRead() {
  if (!$('aiBox')) return;
  $('aiBox').innerHTML = `<div class="ai">🤖 사진 ${Math.min(PH.length, AI_MAX_PH)}장에서 사서함 번호·유통기한 읽는 중…</div>`;
  let d;
  // ⚡ 11-19: 사서함 찾기는 송장의 큰 글자만 읽으면 돼서 작은 사진(1024px)으로 보낸다 → 올리는 시간 단축.
  //   (유통기한 읽기는 작은 날짜 글자 때문에 지금처럼 큰 사진 그대로)
  try { const imgs = await Promise.all(PH.slice(0, AI_MAX_PH).map(p => shrinkUrl(p.big, 1024, 0.8).catch(() => p.ai)));
        d = await call('inspRead', { find: 1, images: imgs }); }
  catch (e) { if ($('aiBox')) $('aiBox').innerHTML = `<div class="warn">AI 읽기 연결 오류 — 직접 골라·넣어주세요.</div>`; return; }
  if (!$('aiBox')) return;
  if (!d.ok) { $('aiBox').innerHTML = `<div class="warn">${esc(d.error || 'AI 읽기 실패')} — 직접 골라·넣어주세요.</div>`; return; }
  FIND = d;
  FIND.noMb = !!(d.labelSeen && !d.mbRaw);            // 송장은 보이는데 사서함 번호가 안 적힘 → 검수 후 수강생에게 안내
  if (MODE !== 'find') {                                // 읽는 사이 상품(또는 미등록)을 먼저 눌렀으면 → 그 화면 칸에 바로 채움
    NOMB = FIND.noMb;
    if (d.lite) {                                       // ⚡ 빠른 AI는 유통기한을 안 읽음 → 이 읽기가 끝나자마자 정확한 AI로 읽기
      if ($('uProd') && d.product && !$('uProd').value) $('uProd').value = d.product;
      if (CUR || $('uBtn')) setTimeout(() => { AIKIND = 'item'; AIREAD_N = 0; aiNow(); }, 0);
      if (FIND.noMb && $('aiBox')) $('aiBox').innerHTML = `<div class="warn">📮 AI가 송장에서 사서함 번호를 못 찾았어요 — 검수 완료 때 한 번 더 물어봐요(정말 없을 때만 수강생에게 안내).</div>`;
      return;
    }
    aiFill(d);
    $('aiBox').innerHTML = (FIND.noMb ? `<div class="warn">📮 AI가 송장에서 사서함 번호를 못 찾았어요 — 검수 완료 때 한 번 더 물어봐요(정말 없을 때만 수강생에게 안내).</div>` : '') + aiHtml(d);
    if ($('uProd') && d.product && !$('uProd').value) $('uProd').value = d.product;
    return;
  }
  const cands = d.cands || [];
  let h = `<div class="ai">🤖 사서함 <b>${esc(d.mb || (d.mbRaw ? d.mbRaw + ' (명부에 없음)' : (d.labelSeen ? '송장에 없음' : '못 찾음')))}</b>${d.name ? ' ' + esc(d.name) : ''}
    ${d.product ? `<br>상품 ${esc(d.product)}` : ''}</div>`;
  if (!d.mb && (d.recvName || d.recvPhone)) {
    h += `<div class="warn">📮 송장에 사서함 번호가 없어요. 받는 분 <b>${esc(d.recvName || '?')}</b> ${esc(d.recvPhone || '')}
      ${cands.length ? '<br>이 수강생 아닌가요? 눌러서 고르세요.' : '<br>명부에서 비슷한 수강생을 못 찾았어요. 아래에서 직접 골라주세요.'}
      ${cands.map(c => `<button type="button" class="btn ghost" style="margin-top:6px" onclick="findPick('${esc(c.mb || c.name)}')"><span class="mb">${esc(c.mb || '번호없음')}</span>${esc(c.name)} <span class="muted">(${esc(c.why)})</span></button>`).join('')}
      ${FIND.noMb ? '<br><span class="muted">검수 완료 때 "정말 번호가 없나요?" 한 번 더 물어봐요 — [확인]일 때만 수강생에게 안내가 가요.</span>' : ''}</div>`;
  }
  h += d.lite ? `<div class="muted" style="margin-top:6px">유통기한·개수는 아래에서 상품을 누르면 바로 읽어요.</div>` : aiHtml(d);
  LAST_AI = d.lite ? null : d;
  $('aiBox').innerHTML = h;
  findPick(d.mb || FIND_PRE || (cands.length === 1 && cands[0].score >= 5 ? (cands[0].mb || cands[0].name) : ''));
}
// 사서함 고르기: 읽은 코드가 있으면 그 학생 대기 입고를 바로, 없으면 대기 사서함 버튼 목록
window.findPick = function (code) {
  const box = $('findBox'); if (!box) return;
  if (!ALL) { box.innerHTML = `<div class="muted">검수 대기 목록 불러오는 중…</div>`; loadAll().then(() => findPick(code)).catch(() => {}); return; }
  if (code) {
    CODE = code; ITEMS = prepItems(ALL.filter(it => matchQ(it, code)), (FIND && FIND.product) || '');
    const kq = $('iq') ? $('iq').value : '';             // 다시 그려도 검색어 유지
    box.innerHTML = `<h2><span class="mb">${esc(code)}</span>${esc((ITEMS[0] && ITEMS[0].name) || (FIND && FIND.name) || '')} · 검수 대기 ${ITEMS.length}건</h2>` +
      (!FIND && ITEMS.length > 1 ? `<div class="muted" style="margin:4px 0">📷 위에서 상품 사진을 찍으면 AI가 비슷한 입고를 맨 위로 올려줘요</div>` : '') +
      listHtml(ITEMS, {}) +
      (ITEMS.length ? '' : `<div class="card muted">이 사서함은 검수 대기 입고가 없어요. 수강생이 등록을 안 했다면 아래 버튼으로 사진을 보내주세요.</div>`) +
      `<button class="btn ghost" onclick="unregView()">📦 등록 안 된 물건 → 수강생에게 사진 보내기</button>
       <button class="btn ghost" onclick="findPick('')">↺ 다른 사서함 고르기</button>`;
    if (kq && $('iq')) { $('iq').value = kq; filterItems(kq); }
    return;
  }
  box.innerHTML = `<div class="card"><label style="margin-top:0">사서함 직접 고르기</label>
      <div class="row"><input id="fq" placeholder="예: B009, 가050, 이름" autocapitalize="characters" onkeydown="if(event.key==='Enter')findPick(this.value.trim().toUpperCase())">
      <button class="btn" style="flex:0 0 76px;margin:0" onclick="findPick($('fq').value.trim().toUpperCase())">고르기</button></div></div>` +
    GROUPS.map(g => `<div class="card item grp" onclick="findPick('${esc(g.mb || g.name)}')"><span><span class="mb">${esc(g.mb || '번호없음')}</span>${esc(g.name)}</span><span class="cnt">${g.n}</span></div>`).join('');
};

// ── 미등록 입고 ──
window.unregView = function () {
  const keep = MODE === 'find' && PH.length; CUR = null; if (!keep) { PH = []; aiCancel(); AIKIND = 'item'; AIREAD_N = 0; LAST_AI = null; } MODE = '';
  NOMB = !!(keep && FIND && FIND.noMb);
  const mb = (FIND && keep && FIND.mb) || (ITEMS[0] && ITEMS[0].mb) || (/^[A-Z가-힣]\d{3}$/i.test(CODE) ? CODE.toUpperCase() : '');
  $('main').innerHTML = `<button class="back" onclick="openCode(CODE)">← 목록으로</button>
    <div class="card"><h2>📦 등록 안 된 물건</h2>
      <p class="muted">수강생이 입고 등록을 안 하고 보낸 물건이에요. 사진을 찍어 보내면 그 수강생 앱에 사진과 함께 <b>"직접 입고 등록해 주세요"</b> 안내가 자동으로 가요.<br>재고내역에는 넣지 않아요. 수강생이 등록하면 평소처럼 검수 목록에 떠요.</p>
      <label>사서함 코드</label><input id="uMb" value="${esc(mb)}" placeholder="예: B009" autocapitalize="characters">
      <label>상품명 (선택 · 알면 적어주세요)</label><input id="uProd" placeholder="상품명">
      <label>옵션 (선택)</label><input id="uOpt">
      ${photoBlock()}
      <label>개수 (선택)</label><input id="uQty" type="number" inputmode="numeric" placeholder="예: 3">
      <label>유통기한</label><input id="uExp" placeholder="예: 2027-05-31">
      <label>수강생에게 남길 말 (선택)</label><input id="uNote" placeholder="예: 박스 1개 도착">
      <button class="btn pink" id="uBtn" onclick="unregSave()">📤 수강생에게 사진 보내기</button></div>`;
  if (keep) {
    $('thumbs').innerHTML = PH.map(p => `<img src="${p.ai}">`).join('');
    $('thumbs').innerHTML = PH.map(p => `<img src="${p.big}">`).join('');
    if (FIND) {
      if (FIND.product) $('uProd').value = FIND.product;
      if (FIND.lite) { AIKIND = 'item'; AIREAD_N = 0; LAST_AI = null; aiNow(); }   // ⚡ 빠른 AI는 유통기한 안 읽음 → 지금 읽기
      else { aiFill(FIND); $('aiBox').innerHTML = aiHtml(FIND); }
    }
    else if (AIRUN) $('aiBox').innerHTML = `<div class="ai">🤖 사진 읽는 중… 끝나면 칸에 채워요</div>`;
    else aiNow();
  }
};
window.unregSave = async function () {
  if (!PH.length) { alert('사진을 1장 이상 찍어주세요 (수강생에게 보내져요)'); return; }
  const b = $('uBtn'); b.disabled = true; b.textContent = '보내는 중…';
  let d;
  const nomb = noMbOk();
  try { d = await call('inspAddUnreg', { noMbNotice: nomb, mb: $('uMb').value.trim(), product: $('uProd').value.trim(), option: $('uOpt').value.trim(), qty: Number($('uQty').value || 0),
    expiry: $('uExp').value.trim(), note: $('uNote').value.trim(), photos: PH.map(p => p.big) }); }
  catch (e) { d = { ok: false, error: '연결 오류 — 보내졌는지 시트 「미등록입고」 탭을 확인해 주세요.' }; }
  if (!d.ok) { alert(d.error || '보내지 못했어요'); b.disabled = false; b.textContent = '📤 수강생에게 사진 보내기'; return; }
  PH = []; draftSave();
  toast('📤 ' + (d.name || '') + ' 님에게 사진 ' + d.photos + '장 보냈어요', 3500);
  openCode(CODE || $('uMb').value.trim());
};

// 📷 사진·입력 임시 보관(11-12 루크 "사진 찍으면 새로고침돼서 사라져 시간을 많이 잡아먹어")
//  폰이 카메라를 여는 동안 메모리가 모자라면 브라우저가 이 페이지를 꺼버린다 → 돌아오면 처음부터 다시 열림.
//  그래서 사진·입력칸·화면 위치를 폰 안(IndexedDB)에 계속 저장해 두고, 다시 열리면 그 자리로 되살린다.
//  '뒤에서 저장 중'인 검수 완료 건(Q)도 같이 보관 → 페이지가 꺼져도 다시 열리면 이어서 저장.
const IDB = (() => { let p; return () => p || (p = new Promise((ok, no) => {
  const r = indexedDB.open('insp', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
})); })();
async function kvSet(k, v) {
  try { const db = await IDB(); await new Promise((ok, no) => { const t = db.transaction('kv', 'readwrite'), s = t.objectStore('kv');
    if (v == null) s.delete(k); else s.put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); t.onabort = () => no(t.error); }); } catch (_) {}
}
async function kvGet(k) {
  try { const db = await IDB(); return await new Promise(ok => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); }
  catch (_) { return null; }
}
const DRAFT_F = ['exp', 'cnt', 'note', 'issueB', 'uMb', 'uProd', 'uOpt', 'uQty', 'uExp', 'uNote'];
let DRAFT_T = null;
function draftNow() {
  const view = CUR && $('doneBtn') ? 'item' : ($('uBtn') ? 'unreg' : (MODE === 'find' ? 'find' : ''));
  if (!view || !PH.length) return kvSet('draft', null);
  const f = {}; DRAFT_F.forEach(k => { if ($(k)) f[k] = $(k).value; });
  return kvSet('draft', { t: Date.now(), view, code: CODE, row: CUR ? CUR.row : 0, at: CUR ? CUR.at : '', f, ph: PH, find: FIND, nomb: NOMB, lastAi: LAST_AI });
}
function draftSave() { clearTimeout(DRAFT_T); DRAFT_T = setTimeout(draftNow, 250); }
function qSave() { kvSet('queue', Q.map(x => ({ row: x.row, label: x.label, body: x.body }))); }
document.addEventListener('input', () => { if (PH.length) draftSave(); }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { clearTimeout(DRAFT_T); draftNow(); } });
// 사진 찍으러 카메라로 가기 직전에도 한 번 저장(입력칸에 적어둔 것까지)
document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('button') && /사진 찍기/.test(e.target.closest('button').textContent || '')) { clearTimeout(DRAFT_T); draftNow(); } }, true);

async function boot() {
  const q = await kvGet('queue');
  if (q && q.length && PIN) {                                // 꺼지기 전에 저장 못 한 검수 완료 건 → 이어서 저장
    Q = q.map(x => ({ row: x.row, label: x.label, body: x.body, err: '' }));
    const busy = new Set(Q.map(x => x.row)); if (ALL) { ALL = ALL.filter(x => !busy.has(x.row)); GROUPS = groupsOf(ALL); }
    qBar(); qRun();
  }
  const d = await kvGet('draft');
  if (!PIN || !d || !d.ph || !d.ph.length || Date.now() - d.t > 6 * 3600e3) return home();
  try {
    if (d.view === 'find') findView('', true);             // 되살릴 땐 카메라 자동으로 안 켬(사진은 아래에서 복원)
    else {
      if (!ALL) { try { await loadAll(); } catch (_) {} }
      await openCode(d.code || '');
      if (d.view === 'item') {
        const i = ITEMS.findIndex(x => x.row === d.row && String(x.at) === String(d.at));
        if (i < 0) { kvSet('draft', null); toast('아까 찍던 상품이 목록에 없어요 (이미 검수됐을 수 있어요)', 3500); return; }
        openItem(i);
      } else unregView();
    }
    PH = d.ph; FIND = d.find || null; NOMB = !!d.nomb; LAST_AI = d.lastAi || null;
    if (MODE === 'find') { FIND = null; AIREAD_N = 0; }        // 사서함 찾기는 다시 읽어 후보를 띄운다
    Object.keys(d.f || {}).forEach(k => { if ($(k)) $(k).value = d.f[k]; });
    if ($('thumbs')) $('thumbs').innerHTML = PH.map(p => `<img src="${p.big}">`).join('');
    if (CUR && $('cnt')) qtyCheck();
    const empty = $('exp') ? !$('exp').value.trim() : ($('uExp') ? !$('uExp').value.trim() : true);
    if (MODE === 'find' || (AI && empty && !LAST_AI)) { AIREAD_N = 0; aiSchedule(); } else AIREAD_N = PH.length;
    if (LAST_AI && $('aiBox') && MODE !== 'find') $('aiBox').innerHTML = aiHtml(LAST_AI);
    toast(`📷 아까 찍은 사진 ${PH.length}장과 적은 내용을 되살렸어요`, 4000);
  } catch (e) { home(); }
}

if (!URL_) $('main').innerHTML = `<div class="warn">두뇌 주소(config.js)를 못 읽었어요.</div>`; else boot();
</script>
